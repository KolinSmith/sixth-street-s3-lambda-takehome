name: Deploy

# Manual trigger only (the "Run workflow" button in the Actions tab) — this deploys real
# AWS resources, so it shouldn't fire automatically on every push the way the CI workflow
# does. This is meant to be run live, on demand.
on:
  workflow_dispatch:

permissions:
  # id-token: write is what lets GitHub issue the short-lived OIDC token this job trades for
  # temporary AWS credentials — no long-lived AWS access keys are stored in this repo at all.
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node (for the CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # This role's trust policy only allows workflow runs from this exact repo
          # (repo:KolinSmith/sixth-street-s3-lambda-takehome:*) to assume it — no static
          # AWS keys are involved anywhere in this process.
          role-to-assume: arn:aws:iam::249091361100:role/sixth-street-takehome-github-actions-deploy
          aws-region: us-east-1

      - name: CDK bootstrap
        # Idempotent — safe to run every time, only does work the first time per account/region.
        run: cdk bootstrap aws://249091361100/us-east-1

      - name: CDK deploy
        run: cdk deploy --require-approval never
